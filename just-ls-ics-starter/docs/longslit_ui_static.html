<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JUST 闀跨紳鍏夎氨浠?路 闈欐€佺晫闈㈡牱绋匡紙MVP锛?/title>
  <style>
    :root{
      --bg:#f5f7fb;
      --card:#fff;
      --text:#1f2a44;
      --sub:#6b7280;
      --pri:#1e3a8a;
      --ok:#16a34a;
      --warn:#f59e0b;
      --bad:#ef4444;
      --bd:#e5e7eb;
      --chip:#eef2ff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif
    }
    .wrap{max-width:2200px;margin:24px auto;padding:0 16px}
    h1{font-size:22px;margin:0 0 16px}
    .muted{color:var(--sub);font-size:12px}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
    .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 6px 18px rgba(30,58,138,.04)}
    .kpi{padding:14px}
    .kpi .lab{font-size:12px;color:var(--sub)}
    .kpi .val{display:flex;align-items:baseline;gap:8px}
    .kpi .big{font-size:22px;font-weight:700}
    .kpi .tag{font-size:11px;color:var(--ok);background:#e8f7ee;border:1px solid #c9f3d8;padding:2px 6px;border-radius:999px}
    .grid{display:grid;grid-template-columns:2fr 1fr;gap:12px}
    .col{display:flex;flex-direction:column;gap:12px}
    .panel{padding:16px}
    .panel h2{font-size:14px;margin:0 0 12px;color:var(--pri);display:flex;justify-content:space-between;align-items:center}
    .pill{padding:4px 10px;border-radius:999px;border:1px solid var(--bd);font-size:12px;background:#fafbff}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .tile{border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:#fff}
    .tile-hd{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--bd);background:#fafbff}
    .chip{font-size:13px;background:var(--chip);color:var(--pri);padding:2px 6px;border-radius:999px;border:1px solid #dce3ff}
    .tile-body{display:flex;gap:16px;flex-wrap:wrap}
    .kv{flex:1;display:grid;gap:12px;grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));font-size:13px;align-content:start}
    .kv div{background:#fafafa;border:1px solid var(--bd);border-radius:8px;padding:12px;min-height:65px;display:flex;flex-direction:column;justify-content:space-between;transition:.2s}
    .kv div:hover{background:#f0f5ff;border-color:#c5d5ff}
    .kv b{display:block;font-size:12px;color:var(--sub);font-weight:600;margin-bottom:8px}
    .controls{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px}
    .controls label{font-size:12px;color:var(--sub);display:block;margin-bottom:6px}
    .controls input[type=number], .controls input[type=text], .controls select{width:100%;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;font-size:12px;background:#fff}
    .btn{padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:#f8fafc;cursor:pointer;font-size:12px}
    .btn:hover{background:#eef2ff;border-color:#c5d5ff}
    .btn-primary{background:var(--pri);color:#fff;border-color:var(--pri)}
    .btn-primary:hover{background:#1e40af}
    .table-wrap{overflow:auto;border:1px solid var(--bd);border-radius:8px;background:#fff}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{border-top:1px solid var(--bd);padding:8px 6px;text-align:left;white-space:nowrap}
    th{font-size:12px;color:var(--sub);font-weight:600;background:#fafbff}
    tbody tr:hover{background:#fafafa}
    .table-wrap thead th{position:sticky;top:0;z-index:1;background:#fafbff}
    .gbar{height:8px;background:#eef2ff;border-radius:999px;overflow:hidden}
    .gbar > i{display:block;height:100%;background:linear-gradient(90deg,#60a5fa,#2563eb)}
    @media (max-width:1100px){
      .kpis{grid-template-columns:repeat(2,1fr)}
      .grid{grid-template-columns:1fr}
      .controls{grid-template-columns:repeat(2,1fr)}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>JUST 闀跨紳鍏夎氨浠?路 鎺у埗绯荤粺锛堥潤鎬佹牱绋匡級</h1>

    <section class="kpis">
      <div class="card kpi"><div class="lab">浠櫒鐘舵€?/div><div class="val"><span class="big" data-id="kpi_state">鍦ㄧ嚎</span><span class="tag pill">妯℃嫙鍣?/span></div></div>
      <div class="card kpi"><div class="lab">褰撳墠妯″紡</div><div class="val"><span class="big" data-id="kpi_mode">Spectroscopy</span><span class="tag pill">闀跨紳</span></div></div>
      <div class="card kpi"><div class="lab">閬ユ祴鍐欏叆</div><div class="val"><span class="big" data-id="kpi_ingest">鈥?/span><span class="tag pill">Influx</span></div></div>
      <div class="card kpi"><div class="lab">鏈€杩戞搷浣?/div><div class="val"><span class="big" data-id="kpi_lastop">鏃?/span><span class="tag pill">鏈湴婕旂ず</span></div></div>
    </section>

    <section class="grid">
      <div class="col">
        <div class="card panel">
          <h2>浠櫒鎬昏 <span class="muted" data-id="clock">--:--:--</span></h2>
          <div class="tile">
            <div class="tile-hd">
              <div>闀跨紳鍏夎氨浠?路 JUST-LS</div>
              <div class="row">
                <span class="chip" data-id="inst_state">杩愯涓?/span>
                <span class="chip" data-id="inst_task">Idle</span>
              </div>
            </div>
            <div class="tile-body">
              <div class="kv">
                <div><b>鐙紳瀹藉害 (渭m)</b><span data-id="slit_width">100.0</span></div>
                <div><b>鍏夋爡 (Grating)</b><span data-id="grating">G1</span></div>
                <div><b>涓績娉㈤暱 (nm)</b><span data-id="central_wl">550.0</span></div>
                <div><b>鐩告満妯″紡</b><span data-id="cam_mode">Fast/ 1脳1</span></div>
                <div><b>CCD 娓╁害</b><span data-id="ccd_temp">-25.0掳C</span></div>
                <div><b>鏍″噯鐏?/b><span data-id="lamp_state">OFF</span></div>
                <div><b>鐜娓╁害</b><span data-id="env_temp">18.3掳C</span></div>
                <div><b>澶ф皵璐ㄩ噺</b><span data-id="airmass">1.12</span></div>
              </div>
            </div>
          </div>

          <div class="controls" style="margin-top:12px">
            <div><label>鐙紳瀹藉害 (渭m)</label><input type="number" id="inp_slit" min="10" max="5000" step="10" value="100"></div>
            <div><label>鍏夋爡</label><select id="sel_grating"><option>G1</option><option>G2</option><option>G3</option></select></div>
            <div><label>涓績娉㈤暱 (nm)</label><input type="number" id="inp_wl" min="300" max="1000" step="1" value="550"></div>
            <div><label>鏍″噯鐏?/label><select id="sel_lamp"><option value="off">OFF</option><option value="ne">Neon</option><option value="ar">Argon</option><option value="hg">Hg</option></select><[...]
            <div style="display:flex;align-items:flex-end"><button class="btn" id="btn_preview">棰勮鍙樻洿</button></div>
            <div style="display:flex;align-items:flex-end"><button class="btn btn-primary" id="btn_apply">搴旂敤锛堝崰浣嶏級</button></div>
          </div>
          <div class="muted" style="margin-top:6px">鎻愮ず锛氬綋鍓嶄负闈欐€佹牱绋匡紱鈥滃簲鐢ㄢ€濇殏涓嶈皟鐢ㄥ悗绔紝浠呮洿鏂伴〉闈€傚悗缁皢瀵规帴 <code>/api/v1/</code> 绯诲垪鎺ュ彛銆?/div>
        </div>

        <div class="card panel">
          <h2>闃熷垪 / 璁″垝锛堢ず鎰忥級 <span class="muted">鍓?8 鏉?/span></h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>璧锋</th><th>鐩爣/妯″紡</th><th>璁剧疆</th><th>鐘舵€?/th></tr></thead>
              <tbody id="queue">
                <tr><td>20:00鈥?0:15</td><td>Bias 脳 20</td><td>Cam Fast/1脳1</td><td>瀹屾垚</td></tr>
                <tr><td>20:20鈥?0:35</td><td>Flat 脳 10</td><td>G1 / 550nm / slit 100渭m</td><td>杩涜涓?/td></tr>
                <tr><td>20:40鈥?1:10</td><td>Arc (Ne)</td><td>G1 / 550nm / lamp Ne</td><td>鎺掗槦</td></tr>
                <tr><td>21:15鈥?2:00</td><td>Science</td><td>G2 / 650nm / slit 120渭m</td><td>鎺掗槦</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="card panel">
          <h2>鏃堕棿淇℃伅 <span class="muted">瀹炴椂鏇存柊</span></h2>
          <div class="row">
            <span class="pill" style="width:100%">UTC锛?span data-id="time_utc">--:--:--</span></span>
            <span class="pill" style="width:100%">CST锛?span data-id="time_cst">--:--:--</span></span>
            <span class="pill" style="width:100%">LST锛?span data-id="time_lst">--:--:--</span></span>
          </div>
        </div>

        <div class="card panel">
          <h2>绯荤粺璧勬簮锛堢ず鎰忥級</h2>
          <div class="row" style="gap:14px">
            <div style="flex:1"><div class="muted">Storage</div><div class="gbar"><i style="width:38%" data-id="bar_storage"></i></div></div>
            <div style="flex:1"><div class="muted">Network</div><div class="gbar"><i style="width:66%" data-id="bar_net"></i></div></div>
          </div>
          <div class="row" style="margin-top:8px">
            <span class="pill">CPU锛?span data-id="cpu">22%</span></span>
            <span class="pill">鍐呭瓨锛?span data-id="mem">58%</span></span>
            <span class="pill">Influx锛?span data-id="influx">杩炴帴寰呴厤</span></span>
          </div>
        </div>

        <div class="card panel">
          <h2>鏈€杩戜簨浠讹紙绀烘剰锛?/h2>
          <div style="height:220px;overflow:auto;background:#0b1220;color:#d0d6e1;border-radius:8px;font-family:ui-monospace,Consolas,monospace;font-size:12px;padding:10px;line-height:1.5" id="log">
[19:00:01] UI 鍒濆鍖栧畬鎴?
[19:02:37] 棰勮锛歴lit 100鈫?20 渭m
[19:10:12] 棰勮锛歡rating G1鈫扜2
[19:12:45] 棰勮锛歝entral_wl 550鈫?50 nm
          </div>
        </div>
      </div>
    </section>
  </div>

<script>
const $ = (sel, root=document)=>root.querySelector(sel);
const setText = (dataId, v)=>{ const el = document.querySelector(`[data-id="${dataId}"]`); if (el) el.textContent = v; };
const STATE = { slit_width: 100.0, grating: 'G1', central_wl: 550.0, lamp: 'off', ccd_temp: -25.0 };

function pad2(n){ return String(n).padStart(2,'0'); }
const SITE_LONGITUDE_DEG = 121.6;
function updateTimes(){
  const now = new Date();
  setText('clock', now.toLocaleTimeString());
  setText('time_utc', now.toISOString().slice(11,19));
  setText('time_cst', now.toLocaleTimeString('zh-CN',{hour12:false,timeZone:'Asia/Shanghai'}));

  const JD = now.getTime()/86400000 + 2440587.5;
  const d  = JD - 2451545.0;
  let GMST = 18.697374558 + 24.06570982441908*d;
  GMST = ((GMST % 24) + 24) % 24;
  let LST = GMST + SITE_LONGITUDE_DEG/15;
  LST = ((LST % 24) + 24) % 24;
  const H = Math.floor(LST), M = Math.floor((LST - H)*60), S = Math.floor(((LST - H)*60 - M)*60);
  setText('time_lst', `${pad2(H)}:${pad2(M)}:${pad2(S)}`);
}
updateTimes(); setInterval(updateTimes, 1000);

function render(){
  setText('slit_width', STATE.slit_width.toFixed(1));
  setText('grating', STATE.grating);
  setText('central_wl', STATE.central_wl.toFixed(1));
  setText('lamp_state', STATE.lamp === 'off' ? 'OFF' : STATE.lamp.toUpperCase());
  setText('ccd_temp', STATE.ccd_temp.toFixed(1)+'掳C');
}
render();

$('#btn_preview')?.addEventListener('click', ()=>{
  const slit = Number($('#inp_slit').value);
  const grat = $('#sel_grating').value;
  const wl   = Number($('#inp_wl').value);
  const lamp = $('#sel_lamp').value;

  const changes = [];
  if (slit !== STATE.slit_width) changes.push(`slit ${STATE.slit_width}鈫?{slit} 渭m`);
  if (grat !== STATE.grating)    changes.push(`grating ${STATE.grating}鈫?{grat}`);
  if (wl   !== STATE.central_wl) changes.push(`central_wl ${STATE.central_wl}鈫?{wl} nm`);
  if (lamp !== STATE.lamp)       changes.push(`lamp ${STATE.lamp}鈫?{lamp}`);
  if (!changes.length) return;

  const log = $('#log');
  const stamp = new Date().toTimeString().slice(0,8);
  log.textContent += `
[${stamp}] 棰勮锛歚 + changes.join(' | ');
  log.scrollTop = log.scrollHeight;

  STATE.slit_width = slit; STATE.grating = grat; STATE.central_wl = wl; STATE.lamp = lamp;
  render();
});

$('#btn_apply')?.addEventListener('click', ()=>{
  const log = $('#log');
  const stamp = new Date().toTimeString().slice(0,8);
  log.textContent += `
[${stamp}] 锛堝崰浣嶏級灏嗚皟鐢ㄥ悗绔?/api/v1/api/v1/slit /api/v1/grating 绛夋帴鍙;
  log.scrollTop = log.scrollHeight;
});

setInterval(()=>{
  const cpu = (15 + Math.random()*20)|0;
  const mem = (50 + Math.random()*15)|0;
  document.querySelector('[data-id="cpu"]').textContent = cpu + '%';
  document.querySelector('[data-id="mem"]').textContent = mem + '%';
}, 4000);
</script>
</body>
</html>
